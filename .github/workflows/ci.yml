name: CI

# TEMPORARY branch for PR #78 (not merged): measure the tint ratio on Windows/macOS and repeat smoke 10x on Windows.
on:
  push:
    branches: ["tmp/**"]

jobs:
  e2e:
    name: e2e-measure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: tint + region specs
        working-directory: apps/desktop
        run: pnpm exec playwright test e2e/pdf-embedded-fonts.spec.ts e2e/region-selection.spec.ts --retries=0 --reporter=list
      - name: smoke --repeat-each=10 (Windows)
        if: runner.os == 'Windows' && always()
        working-directory: apps/desktop
        run: pnpm exec playwright test e2e/smoke.spec.ts --repeat-each=10 --retries=0 --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measure-${{ matrix.os }}
          path: apps/desktop/test-results
          retention-days: 3
          if-no-files-found: ignore
