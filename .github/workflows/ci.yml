name: CI

# TEMPORARY branch for PR #78 (not merged): counter-proof: ::selection tint disabled, the tint assertion must fail on Windows/macOS.
on:
  push:
    branches: ["tmp/**"]

jobs:
  e2e:
    name: e2e-counterproof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: tint + region specs
        working-directory: apps/desktop
        run: pnpm exec playwright test e2e/pdf-embedded-fonts.spec.ts -g "layer glyphs vs canvas glyphs" --retries=0 --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counterproof-${{ matrix.os }}
          path: apps/desktop/test-results
          retention-days: 3
          if-no-files-found: ignore
