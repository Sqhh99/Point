name: Release

# Push a tag `v<version>` (or `v<version>-<suffix>` for a test draft) matching
# apps/desktop/package.json. One job creates the draft release, then each platform
# builds both arches once, verifies them, and uploads its files with a single
# `gh release upload` (no electron-builder publish, so nothing is uploaded twice).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches app version
        shell: bash
        run: |
          v=$(node -p "require('./apps/desktop/package.json').version")
          case "${GITHUB_REF_NAME}" in
            "v$v"|"v$v-"*) ;;
            *) echo "tag ${GITHUB_REF_NAME} does not match v$v"; exit 1 ;;
          esac
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=""; case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease" ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft $pre --verify-tag \
              --title "Point ${GITHUB_REF_NAME}" --generate-notes

  build:
    name: build (${{ matrix.os }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure Inno Setup 6
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: pnpm --filter @point/desktop run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: pnpm --filter @point/desktop run verify:package
      - name: Upload to draft release
        shell: bash
        working-directory: apps/desktop/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=( *-setup.exe *.dmg *.dmg.blockmap latest-mac.yml )
          ls -l "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
