packages:
  - "packages/*"
  - "apps/*"
onlyBuiltDependencies:
  - electron
  - esbuild
  - better-sqlite3
# Install both CPU variants of optional native packages (e.g. @napi-rs/canvas-darwin-x64
# and -arm64) so a single runner can package x64 and arm64 builds. electron-builder.yml
# keeps only the target arch's copy in each package.
supportedArchitectures:
  os: [current]
  cpu: [x64, arm64]
